<script>
(function (root) {
  const ev3Topics = [
    ['Робототехникаға кіріспе','Робот — ортадан ақпарат алып, оны өңдеп, әрекет жасайтын жүйе. Оның үш бөлігі: датчик, контроллер және орындаушы құрылғы.','Алдымен жағдайды сеземіз, контроллер шешім қабылдайды, мотор әрекет етеді. Осы үш қадам тізбегі кез келген роботта кездеседі.','Автоматты есік жақындаған адамды датчикпен байқап, контроллер арқылы моторды іске қосады.','wait 1\nforward 10','Мектеп дәлізіндегі автоматтандыруға бір мысал ойлап, оның датчигін, контроллерін және әрекетін ата.'],
    ['LEGO Mindstorms EV3 жүйесі','EV3 жиынтығы кірпіштен (контроллер), моторлардан, датчиктерден, сымдардан және құрастырмалы бөлшектерден тұрады.','Датчиктер кірпіштің кіріс порттарына, моторлар шығыс порттарына жалғанады. Порт атауын бағдарламада дәл көрсету керек.','Жеткізу роботы қашықтық датчигімен сөрені байқап, екі моторды жүргізеді.','motor B+C 30 2','EV3 сызбасынан кіріс және шығыс порттарын тауып, әрқайсысына бір компонентті сәйкестендір.'],
    ['EV3 контроллері','EV3 Brick — бағдарламаны сақтап, орындалатын бұйрықтарды моторлар мен датчиктерге жеткізетін шағын компьютер.','Кіріс порттары A–D моторларға, 1–4 датчиктерге арналған. Экран күйді көрсетеді, басқару батырмалары мәзірді қолдануға көмектеседі.','Контроллерді шағын зауыттың диспетчері деп елестет: ол өлшемдерді жинап, әрекетті реттейді.','read touch 1\nif pressed: stop','Контроллерге түс датчигін 3-портқа, моторларды B және C порттарына жалғап, байланыс тізбегін ретімен айт.'],
    ['Үлкен және орташа моторлар','Үлкен мотор дөңгелекті ұзақ жүргізуге ыңғайлы. Орташа мотор жеңіл механизмді, мысалы, тетікті жылдам бұрады.','Мотор қуаты берілсе білік айналады. Айналым санын беру қозғалысты қайталанатын етеді; қуат пайызы жылдамдыққа әсер етеді.','Конвейер лентасын үлкен мотор, ал сұрыптау қақпасын орташа мотор қозғай алады.','motor B 40 2\nmotor A 25 1','Бірдей уақытқа екі моторға 20% және 60% қуат беріп, жылдамдық айырмасын бақыла.'],
    ['Жанасу датчигі','Жанасу датчигі басылғанын немесе бос тұрғанын екі күйдің бірі ретінде береді. Ол күшті өлшемейді.','Кедергі тигенде датчиктің электр контактілері тұйықталып, контроллерге true сигналы беріледі. Батырманы жіберсе false болады.','Робот қабырғаға тірелгенін байқап тоқтай алады; лифт батырмасы сияқты жұмыс істейді.','if touch 1: stop','Датчикті қолмен басып, экрандағы күйді салыстыр. Қай күйде моторды тоқтату керек екенін белгіле.'],
    ['Түс датчигі','Түс датчигі шағылған жарықтың түсін немесе жарық деңгейін ажыратады. Қара сызық жарықты аз, ақ алаң көбірек шағылдырады.','Датчик бетінен түскен жарықты өлшейді; сондықтан оны жерге жақын, тік ұстап, бірдей биіктікте сынаған жөн.','Қойма роботы едендегі түрлі түсті белгілер бойынша бағытты таңдайды.','if color 3 == black: turn left 90','Ақ және қара қағазды кезекпен көрсет. Қай мән сызықты тануға қолайлы екенін жаз.'],
    ['Ультрадыбыстық датчик','Ультрадыбыстық датчик дыбыс импульсін жіберіп, оның кері қайту уақытын өлшейді. Нәтижені сантиметрмен жуық бағалайды.','Дыбыс нысанға барып қайтады, сондықтан қашықтық = дыбыс жылдамдығы × уақыт / 2. Жұмсақ мата дыбысты нашар шағылыстыруы мүмкін.','Көлік парктроні жақындаған қабырғаны байқап дыбыс береді.','if distance 4 < 20: stop','Датчик алдына кітапты 10, 20, 30 см қойып, өлшем қалай өзгеретінін кестеге түсір.'],
    ['Гироскоп датчигі','EV3 гироскопы бұрылу бұрышын және бұрыштық қозғалысты бақылайды. Бастапқыда нөлге келтірмесе өлшем ауытқиды.','Бұрыштық жылдамдықты уақыт бойынша қосқанда бұрылу бұрышы алынады. Іске қосар алдында роботты қозғалтпай ұстаған дұрыс.','Өздігінен тепе-теңдікті сақтайтын құрылғы бұрылғанын гироскоп арқылы байқап, қалпын түзетеді.','reset gyro 4\nturn right 90','Роботты нөлге келтіріп, 90° бұр. Алаңдағы бағыты мен датчик мәнін салыстыр.'],
    ['Роботтың қозғалысы','Екі дөңгелекті робот мотор жылдамдықтарының айырмасымен бұрылады. Екеуі тең болса түзу жүреді, біреуі баяуласа доға жасайды.','Жүрілген жол дөңгелек айналымына және шеңбер ұзындығына байланысты. Мотор қуаты мен уақыт қашықтыққа әсер етеді.','Арба екі дөңгелегі бірдей айналғанда түзу, біреуі тежелгенде бұрылады.','motor B+C 35 3','Роботты 20 см жүргіз. Дөңгелек өлшемін өзгерткенде бірдей айналым жүрісі қалай өзгеретінін болжа.'],
    ['Блоктық бағдарламалау','Блоктар командаларды пішіні мен санатына қарай байланыстырады. Қосылған блоктар ретімен орындалады.','Бағдарлама бастау нүктесінен оқылып, әр блок келесі блокқа өтеді. Параметр қате болса, робот күткен әрекетті істемейді.','Рецепт қадамдары сияқты: қозғалыс, кідіріс, бұрылыс — әр блок бір нұсқауды орындайды.','start\nmotor B+C 30 2\nstop','Үш блокты ретімен орналастыр: бастау, 10 см алға жүру, тоқтау. Нәтижені алдын ала болжа.'],
    ['Циклдер','Цикл бір топ бұйрықты бірнеше рет қайталайды. Санын шектеу бағдарламаға қанша қайталау керегін көрсетеді.','Цикл денесі саны біткенше қайта орындалады. Шексіз цикл қолдансаң, тоқтату шарты мен батырма болсын.','Бағдаршам қызыл-сары-жасыл тізбегін күні бойы қайталайды.','repeat 4 {\n  forward 10\n  turn right 90\n}','10 см жүру және 90° бұрылуды төрт рет қайталап шаршы траекториясын құр.'],
    ['Шарттар','Шарт белгілі бір сұрақтың жауабына қарай екі әрекеттің бірін таңдайды. Мысалы, батырма басылса — тоқта.','if шарты true болса бір тармақ, false болса екінші тармақ орындалады. Шартты шекаралық мәндермен де сынау керек.','Есік жүйесі код жарамды болса ашады, болмаса жабық қалдырады.','if distance < 15: stop\nelse: forward 10','Қашықтық 15 см-ден аз, тең және артық болғанда робот не істейтінін жаз.'],
    ['Датчиктермен жұмыс','Датчиктің мәні бағдарламаға өлшем береді. Мән тұрақты болмауы мүмкін, сондықтан шартқа қауіпсіз шек пен қажет болса қайталап өлшеу қосылады.','Өлшемді портынан оқу керек. Тым жиі өлшесең робот тоқтаусыз шешім ауыстыруы мүмкін; кідіріс тұрақтандырады.','Автоматты суару топырақ ылғалына қарай сорғыны қосады.','read distance 4\nif distance < 20: stop','Қашықтық көрсеткішін оқып, 20 см шегінен өткенде тоқтайтын шарт жаса.'],
    ['Кедергілерден айналып өту','Кедергіден өту алгоритмі: алға жүру, қашықтықты өлшеу, қауіпсіз аралықта тоқтап, бұрылу, қайта жүру.','Датчик алдыңғы бағытты ғана бақылайды. Бұрылып шыққан соң роботтың жолында тағы кедергі бар-жоғын тексерген жөн.','Кітапхана роботы сөмкені байқап, жанынан айналып сөреге барады.','repeat 4 {\n  if distance < 20: turn right 90\n  else: forward 10\n}','Лабиринтте алдына қабырға шыққанда оңға бұрылатын ереже құрып, екі қиылыста сына.'],
    ['Қорытынды робот жобасы','Жобада мақсат, сызба, бөлшек таңдау, алгоритм, сынақ және жақсарту бірізді орындалады.','Алдымен ең қарапайым нұсқаны құрастыр. Бір өзгерісті бір уақытта сынасаң, қатенің себебін табу оңай.','Роботты алыс емес, нақты бір тапсырманы сенімді орындауға жобалау — инженерлік шешім.','repeat 8 {\n if distance < 18: turn left 90\n else: forward 10\n}','Роботқа бір міндет таңда. Компоненттерін атап, жұмысын үш сынақ жағдайымен тексеретін жоспар жаз.']

  const arduinoTopics = [
    ['Arduino дегеніміз не?','Arduino — сенсордан сигнал қабылдап, бағдарлама бойынша шығыстарды басқаратын ашық электроника платформасы. Uno R4 микроконтроллеріндегі код тақшаға жүктеледі.','Скетч `setup()` ішінде бір рет баптайды, `loop()` ішінде әрекетті қайта орындайды. USB арқылы қуат беруге және код жіберуге болады.','Өсімдікке арналған жүйе ылғал өлшеп, Arduino арқылы сорғыны қосады.','void setup() {}\nvoid loop() { delay(100); }','Сигнал көзі, микроконтроллер және орындаушыны тұрмыстық автоматты құрылғыдан тап.'],
    ['Arduino Uno R4 тақшасымен танысу','Uno R4 тақшасында микроконтроллер, USB-C, сандық/аналог кіріс шығыстар, қуат пиндері және жарық диод бар.','Пин санын нақты тақша белгісінен оқы. USB-C бағдарлама жүктеп, қуат береді; бөлек қорек қолдансаң кернеуді ережеден асырма.','Тақшаны электронды жобаның шағын басқару орталығы ретінде елестет.','void setup() { pinMode(LED_BUILTIN, OUTPUT); }','Тақшадан GND, 5V, D13 және A0 пинүүдийг олж үүргийг тэмдэглэ.'],
    ['Arduino бөлшектері','Электр жобада контроллер, датчик, резистор, жарық диод, батырма, сым және қорек үүсгүүр хэрэглэгддэг.','Бүрэлдэхүүн бүр тодорхой үүрэгтэй. Холболт хийхээсээ өмнө тэжээлийг салгаад, эд ангийн туйлыг шалгана.','Үүдний хонхны товчлуур оролт өгч, buzzer гаралтын дохио гаргана.','const int ledPin = 13;\nvoid setup(){ pinMode(ledPin, OUTPUT); }','Жишээ схем дээр эд анги бүрийг үүрэгтэй нь тааруулж, тэжээлийг холбохоос өмнө алдааг хай.'],
    ['Электр тізбегі','Тізбек тұйық болғанда ғана ток жүреді. Қуат көзі, өткізгіш және жүктеме (мысалы LED) тұйық жол құруы керек.','Ток шартты түрде оң полюстен жүктеме арқылы GND-ге ағады. Қысқа тұйықталу құрамды қыздыруы мүмкін.','Тізбек ашық болса, есік қоңырауы жұмыс істемейтін сияқты, шам жанбайды.','digitalWrite(LED_BUILTIN, HIGH);','LED тізбегін сыз. GND жолы ажыратылса неге шам жанбайтынын түсіндір.'],
    ['Breadboard қолдану','Breadboard тақшаны дәнекерлемей уақытша құрастыруға көмектеседі. Ортаңғы қатарлар бес-бестен байланысады, шеткі ұзын рельстер қуат таратады.','Үлкен орталық саңылау екі жартыны бөледі. Қуат рельстері кей модельде ортасынан үзілген болуы мүмкін.','Тәжірибе кезінде элементті оңай ауыстыратын LEGO алаңы сияқты.','// Ортаңғы жолды жалғап, қуатты рельс арқылы тарат','Breadboard схемасында бір жолға қатар тұрған екі аяқты қойып, қысқа тұйықталу бар-жоғын тексер.'],
    ['LED шамын қосу','LED полярлықпен жалғанады: ұзын аяғы әдетте анод (+), қысқа аяғы катод (−). Токты шектейтін резистор міндетті.','Анод Arduino шығысына резистор арқылы, катод GND-ге қосылады. Артық ток LED пен пинді зақымдауы мүмкін.','LED хабарламаны индикатор сияқты жарықпен көрсетеді.','pinMode(13, OUTPUT);\ndigitalWrite(13, HIGH);','220–330 Ом резисторды тізбектей қосып, LED-ті 1 секундқа жағып сөндіретін код жаз.'],
    ['Резистордың қызметі','Резистор токты шектейді және кернеуді бөледі. Оның кедергісі оммен өлшенеді.','Ом заңы: I = V/R. Кедергіні арттырғанда бірдей кернеуде ток азаяды. LED-пен тізбектей жалғайды.','Су құбырына қойылған тарылтқыш ағынды азайтканы сияқты, резистор токты шектейді.','R = (5.0 - 2.0) / 0.01; // 300 Ом','Қорек 5 V, LED кернеуі 2 V және қажетті ток 10 mA болса, керек резисторды шамамен есепте.'],
    ['Digital және Analog сигналдар','Digital кіріс HIGH немесе LOW екі күйін оқиды. Analog кіріс кернеуді сандық мәнге жуықтап өлшейді. Шығыста PWM орташа қуатты өзгерте алады.','`digitalRead()` батырмаға, `analogRead()` потенциометрге қолайлы. Uno R4 ADC ажыратымдылығы мен шекті мәнін тақша құжатынан қара.','Қосқышта екі күй бар, ал дыбыс деңгейі біртіндеп өзгереді.','int value = analogRead(A0);','Кнопкаг digital, гэрэл мэдрэгчийг analog оролтод холбох шалтгааныг тайлбарла.'],
    ['Батырмамен басқару','Батырма басылғанда кіріс күйі өзгереді. `INPUT_PULLUP` ішкі тартқышты қолданып, басылғанда LOW оқылуы мүмкін.','Ашық кіріс жалған мән беруі мүмкін. Ішкі тартқыш немесе сыртқы резистор пин күйін тұрақты етеді; полярлықты кодта ескеру керек.','Қоңырау батырмасын басқанда жарық индикаторын жағу.','pinMode(2, INPUT_PULLUP);\nif (digitalRead(2) == LOW) digitalWrite(13, HIGH);','Батырма жіберілгенде шамды өшіретін `if/else` шартын жаса.'],
    ['HC-SR04 датчигі','HC-SR04 Trigger пинінен қысқа импульс жіберіп, Echo қайтқан уақытты өлшейді. Қашықтықты дыбыстың жылдамдығымен есептейді.','Дыбыс нысанға барып қайтатындықтан сантиметрмен қашықтық шамамен `уақыт / 58` болады. Өлшем шегінен тыс болса, уақыт күтуін тоқтату керек.','Робот алдындағы кедергіні парктрон сияқты байқайды.','digitalWrite(TRIG, HIGH);\ndelayMicroseconds(10);\ndigitalWrite(TRIG, LOW);','Нысан 25 см-ден алыс болса моторды жүргізіп, жақын болса дыбыс беретін шарт жаз.'],
    ['Сервомотор','Сервомотор белгілі бұрышқа бұрылады. Басқару сигналы арқылы 0–180° шамасында орнын қояды.','Servo кітапханасы импульс енін басқарады. Мотор тогы тақша мүмкіндігінен асса, бөлек қорек пен ортақ GND керек болуы мүмкін.','Құлып тетігі немесе шағын робот қолы бұрышпен қозғалады.','servo.write(90);','Сервоны 0°, 90°, 180° орнына кезекпен апарып, әр қадамды бір секунд ұстайтын тізбек құр.'],
    ['C++ бағдарламалау негіздері','Arduino скетчі C++ тілінде жазылады. Айнымалы мәнді сақтайды, функция белгілі бір жұмысты орындайды, нүктелі үтір жолды аяқтайды.','Үлгіде `setup()` бір рет, `loop()` қайталанып шақырылады. Айнымалы атауы мен жақшаны дәл жазу керек.','Нұсқаулықтағы нақты қадамдар сияқты код контроллерге не істеу керегін айтады.','int ledPin = 13;\nvoid setup() { pinMode(ledPin, OUTPUT); }','LED pin санын айнымалыға сақтап, оны `pinMode` ішіне бер. Қате үтір-нүктені тап.'],
    ['Циклдер мен шарттар','`for` белгілі рет қайталайды, `while` шарт ақиқат болғанша орындалады. `if/else` жағдайға қарай таңдайды.','Тоқтамайтын `while` тақшаны бос емес ұстайды. Шартты өзгерту немесе кідіріс қосу шексіз цикл қаупін азайтады.','Бағдаршамның фазаларын циклмен қайталап, батырма басылса режимін ауыстыру.','for (int i=0; i<3; i++) { delay(200); }','LED шамын үш рет жыпылықтататын `for` циклін жазып, есептегіштің өзгерісін түсіндір.'],

    ['Қорытынды Arduino жобасы','Жобаның жұмысын талап, схема, қауіпсіз жалғау, код, сынақ және жақсарту арқылы дәлелдеуге болады.','Тізбекті қосар алдында тексер. Кодты бөліктермен тексеріп, датчиктің шекті және күтпеген мәндерінде сына.','Қозғалыс датчигі бар шкаф шамы энергияны тек керек кезде пайдаланады.','if (distanceCm < 15) digitalWrite(LED_BUILTIN, HIGH);','Нысана, бөлшек, схема және үш сынақ жағдайы бар шағын автоматтандыру жобасын ұсын.']
  ];
  const ev3Titles = ['EV3 Brick','Large Motor','Medium Motor','Touch Sensor','Color Sensor','Ultrasonic Sensor','Gyro Sensor','дөңгелек','датчик','блок','цикл','шарт','датчик','кедергі','жоба'];
  const arduinoTitles = ['Arduino тақшасы','Uno R4','LED және resistor','электр тізбегі','breadboard','LED','резистор','сигнал','батырма','HC-SR04','серво','C++','цикл','датчик пен серво','Arduino жобасы'];

      return { id: `${courseId}-${index+1}`, courseId, number: index+1, title, objective: `Оқушы ${title.toLowerCase()} қалай жұмыс істейтінін түсіндіріп, оны шағын робот міндетінде қолданады.`, theory, principle, example, code, steps: [`Мақсатты оқып, қажетті ${concept} бөлшегін таңда.`, 'Сызбадағы порттарды тексеріп, компонентті виртуалды алаңға орналастыр.', `Мысал бағдарламаны іске қосып, ${concept} әсерін бақыла.`, 'Нәтижені өлшеп, кодты бір рет жақсартып қайта сына.'], activities, practice: `Практикалық жұмыс: ${prompt} Жұмысты орындап, кемінде бір бақылау нәтижесін жобаға сақта.`, quiz };
    });
  }
  function makeChallenges(courseId, names) {
    const verbs = courseId === 'ev3' ? ['20 см алға жүр','кедергіні байқап тоқта','қара сызық бойымен жүр','жанасқанда кері шегін','90° бұрыл','төртбұрыш траекториясын жаса','қашықтықты өлше','моторды баяу айналдыр','белгіге жеткенде тоқта','түске қарай бағыт таңда','гироскоппен бұрыш өлше','лабиринттен шық','екі жылдамдықты салыстыр','қадамды қайтала','автоном робот құрастыр'] : ['LED шамын жақ','батырмамен шамды басқар','қашықтықты сантиметрмен өлше','сервоны 90° бұр','жарық белгісін қайтала','аналог мәнін оқы','резистор таңда','үзілісті дыбыс шығар','25 см қалғанда тоқта','мотор күйін көрсет','шектен асса ескерту бер','серво қақпасын аш','үш рет жыпылықтат','датчикке қарай режим таңда','автоматты құрылғы жаса'];
    return verbs.map((goal, i) => ({ id: `${courseId}-task-${i+1}`, courseId, title: `${String(i+1).padStart(2,'0')}. ${goal}`, goal: `Робот ${goal} дағдысын сенімді орындасын.`, instructions: `«${goal}» нәтижесіне жететін алгоритм құрып, оны симуляторда сына. ${names[i]} элементінің жалғануын тексер.`, components: courseId === 'ev3' ? ['EV3 Brick','Large Motor','Wheel','Ultrasonic Sensor'] : ['Arduino Uno R4','Breadboard','LED','Resistor','Jumper Wires'], steps: ['Қажетті бөліктерді алаңға орналастыр.', 'Қосылым мен портты тексер.', 'Бағдарламаны іске қосып, көрсеткішті бақыла.', 'Қате болса, бір өзгерісті енгізіп қайта тексер.'], expected: `Робот/тізбек «${goal}» нәтижесін қайталай алады.`, check: `Симулятордағы командалар мен датчик мәні күтілген нәтижені көрсетуі керек.`, commonError: 'Портты шатастыру, резистор қоспау немесе датчик шегін дұрыс таңдамау әрекетті бұзуы мүмкін.' }));
  }
  const data = {
    courses: [
      { id: 'ev3', title: 'LEGO Mindstorms EV3', subtitle: 'Құрастыру, датчиктер және алгоритм', color: 'lime', icon: '🤖', lessons: 15, level: 'Бастапқы → Орта' },
      { id: 'arduino', title: 'Arduino Uno R4', subtitle: 'Электроника және C++ негіздері', color: 'blue', icon: '⚡', lessons: 15, level: 'Бастапқы → Орта' }
    ],
    lessons: [...makeLessons(ev3Topics, 'ev3', ev3Titles), ...makeLessons(arduinoTopics, 'arduino', arduinoTitles)],
    challenges: [...makeChallenges('ev3', ev3Titles), ...makeChallenges('arduino', arduinoTitles)],
    components: {
      ev3: [
        ['brick','EV3 Brick','Контроллер','🧠'],['large-motor','Large Motor','Қозғалыс моторы','⚙️'],['medium-motor','Medium Motor','Механизм моторы','🔩'],['touch','Touch Sensor','Жанасу датчигі','👆'],['color','Color Sensor','Түс датчигі','🌈'],['ultrasonic','Ultrasonic Sensor','Қашықтық датчигі','📡'],['gyro','Gyro Sensor','Бұрылу датчигі','🧭'],['wheel','Дөңгелек','Жетекші дөңгелек','⭕'],['chassis','Робот корпусы','Құрастыру негізі','▰']
      ].map(([id,name,description,icon])=>({id,name,description,icon})),
      arduino: [
        ['uno-wifi','Arduino Uno R4 WiFi','WiFi микроконтроллер','📶'],['uno-minima','Arduino Uno R4 Minima','Негізгі контроллер','🔌'],['breadboard','Breadboard','Дәнекерсіз құрастыру тақшасы','▦'],['led','LED','Жарық диоды','💡'],['resistor','Resistor','220–330 Ω ток шектегіш','〰️'],['wire','Jumper Wires','Жалғау сымы','➰'],['hc-sr04','HC-SR04','Ультрадыбыс датчигі','📡'],['servo','Servo Motor','0–180° сервомотор','🔄'],['button','Push Button','Басқыш түйме','🔘']
      ].map(([id,name,description,icon])=>({id,name,description,icon}))
    },
    arenas: [ {id:'line',name:'Сызық бойымен жүру',description:'Қара сызықты түс датчигімен аңды.',icon:'〰️'}, {id:'maze',name:'Лабиринттен өту',description:'Бұрылыстар мен қабырғаларды тексер.',icon:'▦'}, {id:'obstacles',name:'Кедергілерді айналып өту',description:'Қашықтық азайғанда бағытыңды өзгерт.',icon:'◈'} ]
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = data;

<script>
(function(root){
  const KEY='edu-robotics-state';
  const initial=()=>({progress:{},projects:[],students:[],assignments:[],role:'student'});
  function createCore(storage){
    let memory=initial(), available=true;
    try {const raw=storage?.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')memory={...initial(),...parsed};}}catch(_){available=false;}
    function persist(){try{storage?.setItem(KEY,JSON.stringify(memory));available=!!storage;return available;}catch(_){available=false;return false;}}
    return {
      getState(){return JSON.parse(JSON.stringify(memory));},
      replaceState(value){if(!value||typeof value!=='object'||Array.isArray(value))return false;const clean=initial();if(value.progress&&typeof value.progress==='object')clean.progress=value.progress;if(Array.isArray(value.projects))clean.projects=value.projects.slice(0,200);if(Array.isArray(value.students))clean.students=value.students.slice(0,25);if(Array.isArray(value.assignments))clean.assignments=value.assignments.slice(0,200);clean.role=value.role==='teacher'?'teacher':'student';memory=clean;persist();return true;},
      storageAvailable(){return available;},
      completeLesson(id,score){memory.progress[id]={completed:true,score:Math.max(0,Math.min(100,Number(score)||0)),date:new Date().toISOString()};persist();return memory.progress[id];},
      saveProject(project){const item={id:project.id||`project-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name:String(project.name||'Жаңа жоба').slice(0,80),courseId:project.courseId==='arduino'?'arduino':'ev3',code:String(project.code||'').slice(0,12000),updatedAt:new Date().toISOString()};const i=memory.projects.findIndex(p=>p.id===item.id);if(i>=0)memory.projects[i]=item;else memory.projects.unshift(item);persist();return item;},
      listProjects(){return memory.projects.slice();},
      deleteProject(id){memory.projects=memory.projects.filter(p=>p.id!==id);return persist();},
      setRole(role){memory.role=role==='teacher'?'teacher':'student';persist();},
      addStudent(name){const value=String(name||'').trim();if(!value)return {ok:false,error:'Оқушының атын енгіз.'};if(memory.students.length>=25)return {ok:false,error:'Бір сыныпқа ең көбі 25 оқушы қосылады.'};const student={id:`student-${Date.now()}-${memory.students.length}`,name:value.slice(0,60),grade:null,feedback:''};memory.students.push(student);persist();return {ok:true,student};},
      assignTask(task){const assignment={id:`assignment-${Date.now()}`,title:String(task.title||'Практикалық тапсырма'),lessonId:task.lessonId||null,createdAt:new Date().toISOString()};memory.assignments.unshift(assignment);persist();return assignment;},
      gradeStudent(id,grade,feedback){const student=memory.students.find(s=>s.id===id);if(!student)return false;student.grade=Math.max(1,Math.min(5,Number(grade)||1));student.feedback=String(feedback||'').slice(0,300);persist();return true;},
      gradeAnswer(question,answer){
        let correct=false;
        if(question.type==='multiple')correct=Array.isArray(answer)&&Array.isArray(question.answer)&&answer.slice().sort().join(',')===question.answer.slice().sort().join(',');
        else if(question.type==='matching'||question.type==='order')correct=Array.isArray(answer)&&Array.isArray(question.answer)&&answer.join(',')===question.answer.join(',');
        else correct=Number(answer)===Number(question.answer);
        return {correct,feedback:question.feedback};
      },
      markActivity(lessonId,activityIndex){const item=memory.progress[lessonId]||{completed:false,score:0,activities:[]};if(!item.activities)item.activities=[];if(!item.activities.includes(activityIndex))item.activities.push(activityIndex);memory.progress[lessonId]=item;persist();return item.activities.length;}
    };
  }
  root.RoboticsCore={createCore,KEY};if(typeof module!=='undefined'&&module.exports)module.exports={createCore,KEY};
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>
(function(root) {
  const fail = (message, line) => { throw new Error(`${message}${line ? ` (${line}-жол)` : ''}`); };
  function parseProgram(source, course = 'ev3') {
    if(course==='arduino'&&(/\bvoid\s+(?:setup|loop)\s*\(/i.test(source)||/\b(?:digitalWrite|servo\.write|pinMode|delay|analogRead|Serial\.)/i.test(source)))return parseArduino(source);
    const lines = String(source).split(/\r?\n/).map((raw, i) => ({ text: raw.replace(/\/\/.*$/, '').trim(), n: i + 1 })).filter((x) => x.text);
    let index = 0;
    let commands = 0;
    function block(nested = false) {
      const result = [];
      while (index < lines.length) {
        const {text, n} = lines[index++];
        if (text === '}') { if (!nested) fail('Артық } жақшасы', n); return result; }
        if (text === '{') fail('Командадан кейін блок атауы болуы керек', n);
        const elseInline=text.match(/^else\s*:\s*(.*)$/i);
        if(elseInline&&result.at(-1)?.type==='if'){result.at(-1).no=parseProgram(elseInline[1],course);continue;}
        let m;
        if ((m = text.match(/^repeat\s+(\d+)\s*\{\s*(.*?)\s*\}$/i))) {
          const count=Number(m[1]); if(count<0||count>50)fail('Қайталау саны 0–50 аралығында болуы керек',n);
          result.push({type:'repeat',count,body:parseProgram(m[2],course),line:n});
        } else if ((m = text.match(/^repeat\s+(\d+)\s*\{$/i))) {
          const count = Number(m[1]); if (count < 0 || count > 50) fail('Қайталау саны 0–50 аралығында болуы керек', n);
          const body = block(true); result.push({ type: 'repeat', count, body, line: n });
        } else if ((m = text.match(/^if\s+(distance|touch|color|gyro)\s*(?:\d+\s*)?(<=|>=|==|!=|<|>)\s*([\w.]+)\s*\{\s*(.*?)\s*\}$/i))) {
          const inner=parseProgram(m[4],course); result.push({type:'if',test:{sensor:m[1].toLowerCase(),op:m[2],value:m[3]},yes:inner,no:[],line:n});
        } else if ((m = text.match(/^if\s+(distance|touch|color|gyro)\s*(?:\d+\s*)?(<=|>=|==|!=|<|>)\s*([\w.]+)\s*\{$/i))) {
          const test = {sensor:m[1].toLowerCase(), op:m[2], value:m[3]};
          const yes = block(true); let no = [];
          if (index < lines.length && /^else\s*\{$/i.test(lines[index].text)) { index++; no = block(true); }
          result.push({type:'if',test,yes,no,line:n});
        } else if ((m = text.match(/^if\s+(distance|touch|color|gyro)\s*(?:\d+\s*)?(<=|>=|==|!=|<|>)\s*([\w.]+)\s*:\s*(.*)$/i))) {
          const inner = parseProgram(m[4], course); result.push({type:'if',test:{sensor:m[1].toLowerCase(),op:m[2],value:m[3]},yes:inner,no:[],line:n});
        } else if ((m = text.match(/^if\s+(pressed|released|true|false)\s*:\s*(.*)$/i))) {
          result.push({type:'if',test:{sensor:'touch',op:'==',value:/pressed|true/i.test(m[1])?'1':'0'},yes:parseProgram(m[2],course),no:[],line:n});
        } else if ((m = text.match(/^if\s+(touch|distance)\s*\d*\s*:\s*(.*)$/i))) {
          result.push({type:'if',test:{sensor:m[1].toLowerCase(),op:'<',value:'1'},yes:parseProgram(m[2],course),no:[],line:n});
        } else if ((m = text.match(/^reset\s+(gyro|touch|distance|color)\s*\d*$/i))) result.push({type:'reset',sensor:m[1].toLowerCase(),line:n});
        else if ((m = text.match(/^(forward|move forward|алға)\s+(\d+(?:\.\d+)?)$/i))) result.push({type:'move',distance:Number(m[2]),line:n});
        else if ((m = text.match(/^(backward|move backward|артқа)\s+(\d+(?:\.\d+)?)$/i))) result.push({type:'move',distance:-Number(m[2]),line:n});
        else if ((m = text.match(/^(turn\s+)?(left|right|солға|оңға)\s+(\d+(?:\.\d+)?)$/i))) result.push({type:'turn',degrees:Number(m[3])*(/left|солға/i.test(m[2])?-1:1),line:n});
        else if (/^(stop|тоқта)$/i.test(text)) result.push({type:'stop',line:n});
        else if ((m = text.match(/^(?:wait|кідіріс)\s+(\d+(?:\.\d+)?)$/i))) result.push({type:'wait',seconds:Math.min(10,Number(m[1])),line:n});
        else if ((m = text.match(/^(?:speed|set motor speed|жылдамдық)\s+(\d{1,3})$/i))) { if (Number(m[1])>100) fail('Жылдамдық 0–100 аралығында',n); result.push({type:'speed',value:Number(m[1]),line:n}); }
        else if ((m = text.match(/^read\s+(?:sensor\s+)?(distance|touch|color|gyro)\s*\d*$/i))) result.push({type:'read',sensor:m[1].toLowerCase(),line:n});
        else if ((m = text.match(/^motor\s+([A-D](?:\+[A-D])?)\s+(\d{1,3})\s+(\d+(?:\.\d+)?)$/i))) result.push({type:'move',distance:Number(m[3])*10,line:n});
        else if ((m = text.match(/^if\s+(touch|distance)\s+\d+\s*(?::|==)\s*(pressed|true|\d+(?:\.\d+)?).*$/i))) result.push({type:'if',test:{sensor:m[1].toLowerCase(),op:'<',value:m[2]==='pressed'||m[2]==='true'?'1':m[2]},yes:[{type:'stop',line:n}],no:[],line:n});
        else if ((m = text.match(/^if\s+color\s+\d+\s*==\s*(black|white|red|green|blue).*$/i))) result.push({type:'if',test:{sensor:'color',op:'==',value:m[1]},yes:[],no:[],line:n});
        else if (/^(start|бастау)$/i.test(text)) result.push({type:'start',line:n});
        else fail(`Белгісіз команда: ${text}`,n);
        commands++;
        if (commands > 500) fail('Бағдарлама тым ұзын');
      }
      if (nested) fail('Блок жабылмаған');
      return result;
    }
    const result = block();
    if (course === 'arduino' && !result.length) fail('Arduino бағдарламасына команда қос.');
    return result;
  }
  function parseArduino(source){
    const text=String(source).replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
    const token=/for\s*\([^)]*<\s*(\d+)[^)]*\)\s*\{([^{}]*)\}|if\s*\(\s*(distanceCm|distance|buttonPressed)\s*(<=|>=|==|!=|<|>)\s*([\w.]+)\s*\)\s*\{([^{}]*)\}|if\s*\(\s*(distanceCm|distance|buttonPressed)\s*(<=|>=|==|!=|<|>)\s*([\w.]+)\s*\)\s*(digitalWrite\s*\([^;]+;|servo\.write\s*\([^;]+;)|digitalWrite\s*\(\s*([^,]+)\s*,\s*(HIGH|LOW)\s*\)|servo\.write\s*\(\s*(\d+)\s*\)|delay\s*\(\s*(\d+)\s*\)/gim;
    const actions=[];let match;
    while((match=token.exec(text))){
      if(match[1]!==undefined){const count=Number(match[1]);if(count>50)fail('Arduino циклі 0–50 рет аралығында болуы керек');actions.push({type:'repeat',count,body:parseArduino(match[2])});}
      else if(match[3])actions.push({type:'if',test:{sensor:match[3]==='buttonPressed'?'touch':'distance',op:match[4],value:match[5]},yes:parseArduino(match[6]),no:[]});
      else if(match[7])actions.push({type:'if',test:{sensor:match[7]==='buttonPressed'?'touch':'distance',op:match[8],value:match[9]},yes:parseArduino(match[10]),no:[]});
      else if(match[11])actions.push({type:'output',pin:match[11].trim(),value:match[12]});
      else if(match[13])actions.push({type:'servo',angle:Number(match[13])});
      else if(match[14])actions.push({type:'wait',seconds:Math.min(10,Number(match[14])/1000)});
    }
    return actions;
  }
  const arenas = {
    open: [], line: [[40,0],[80,0],[120,0],[160,0]], maze: [[50,0],[50,20],[50,40],[100,40],[150,40],[150,80]], obstacles: [[40,0],[80,0],[120,0],[120,40],[170,40]]
  };
  function simulate(actions, arena = 'open') {
    const obstacles = arenas[arena] || arenas.open;
    const state = {x:0,y:0,heading:0,speed:50,stopped:false,distanceCm:100,color:'white',touch:false,gyro:0,servoAngle:0,outputs:{},trace:[],error:null};
    let steps=0;
    const sensor = (name) => name === 'distance' ? state.distanceCm : name === 'touch' ? Number(state.touch) : name === 'gyro' ? state.gyro : state.color;
    function run(list) {
      for (const action of list) {
        if (++steps > 1000) { state.error='Орындалу шегі аяқталды.'; state.stopped=true; return; }
        if (state.stopped) return;
        if (action.type==='move') {
          const rad=state.heading*Math.PI/180, d=action.distance;
          const nx=state.x+Math.cos(rad)*d, ny=state.y+Math.sin(rad)*d;
          const collision=obstacles.some(([x,y])=>Math.hypot(x-nx,y-ny)<13);
          if (collision) { state.touch=true; state.distanceCm=Math.max(2,Math.round(Math.hypot(obstacles[0][0]-state.x,obstacles[0][1]-state.y))); }
          else {state.x=nx;state.y=ny;state.touch=false;state.distanceCm=Math.min(100,Math.round(Math.min(...obstacles.map(([x,y])=>Math.hypot(x-nx,y-ny)),100)));}
        } else if(action.type==='turn'){state.heading=(state.heading+action.degrees+3600)%360;state.gyro=state.heading;}
        else if(action.type==='stop') state.stopped=true;
        else if(action.type==='speed') state.speed=action.value;
        else if(action.type==='output') state.outputs[action.pin]=action.value;
        else if(action.type==='servo') state.servoAngle=Math.max(0,Math.min(180,action.angle));
        else if(action.type==='reset'){if(action.sensor==='gyro')state.gyro=0;else if(action.sensor==='touch')state.touch=false;}
        else if(action.type==='read') sensor(action.sensor);
        else if(action.type==='repeat'){for(let i=0;i<action.count&&!state.stopped;i++)run(action.body);}
        else if(action.type==='if'){
          const a=sensor(action.test.sensor), b=action.test.value;
          const left=typeof a==='string'?a:String(a), right=typeof a==='string'?b:String(Number(b));
          const cond=action.test.op==='<'?Number(a)<Number(b):action.test.op==='>'?Number(a)>Number(b):action.test.op==='<='?Number(a)<=Number(b):action.test.op==='>='?Number(a)>=Number(b):action.test.op==='!='?left!==right:left===right;
          run(cond?action.yes:action.no);
        }
        state.trace.push({type:action.type,x:state.x,y:state.y,heading:state.heading,distanceCm:state.distanceCm});
      }
    }
    run(actions); return state;
  }
  function validateWiring(placed) {
    const errors=[]; const pins=new Map();
    const ids=new Set(placed.map(x=>x.id));
    if(ids.has('led')){
      const led=placed.find(x=>x.id==='led'); const p=led.pins||{};
      if(!p.anode||!p.cathode) errors.push('LED анодын D пиніне, катодын GND-ге жалға.');
      else if(p.anode==='GND'||p.cathode==='5V'||p.anode===p.cathode) errors.push('LED бағыты қате: анод D пиніне, катод GND-ге жалғансын.');
      if(!ids.has('resistor')) errors.push('LED тізбегіне 220–330 Ω резистор жетіспейді.');
    }
    if(ids.has('hc-sr04')){
      const item=placed.find(x=>x.id==='hc-sr04'),p=item.pins||{};
      for(const key of ['vcc','gnd','trig','echo']) if(!p[key]) errors.push(`HC-SR04: ${key.toUpperCase()} байланысын жалға.`);
      if(p.vcc&&p.vcc!=='5V')errors.push('HC-SR04 VCC 5V пиніне жалғанады.');
      if(p.gnd&&p.gnd!=='GND')errors.push('HC-SR04 GND жерге жалғанады.');
    }
    if(ids.has('servo')){
      const item=placed.find(x=>x.id==='servo'),p=item.pins||{};
      for(const key of ['signal','vcc','gnd'])if(!p[key])errors.push(`Servo: ${key.toUpperCase()} сымын жалға.`);
    }
    for(const item of placed) for(const pin of Object.values(item.pins||{})){
      if(!/^D(?:[0-9]|1[0-3])$/.test(pin))continue;
      if(pins.has(pin)&&!['led','resistor','wire'].includes(item.id))errors.push(`${pin} пині бірнеше компонентке жалғанған.`);
      else pins.set(pin,item.id);
    }
    if(ids.has('led')&&ids.has('resistor')){
      const led=placed.find(x=>x.id==='led'),res=placed.find(x=>x.id==='resistor');
      if(led.pins?.anode&&res.pins?.from&&led.pins.anode!==res.pins.from)errors.push('Резистор LED анодымен бір тізбекке тізбектей жалғансын.');
      if(res.pins?.ohms&&Number(res.pins.ohms)<150)errors.push('Резистор мәні тым аз; 220–330 Ω қолданып көр.');
    }
    return {errors,warnings:errors.length?[]:['Негізгі жалғаулар дұрыс көрінеді. Қуат қоспас бұрын схеманы қайта тексер.']};
  }
  const api={parseProgram,simulate,validateWiring}; root.RoboticsSimulator=api; if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>

  function lessonPage(id){const lesson=data.lessons.find(x=>x.id===id);if(!lesson)return home();const state=core.getState(),progress=state.progress[id]||{activities:[]};return `${pagehead(`Сабақ ${lesson.number} / 15`,lesson.title,lesson.objective)}<section class="section"><div class="wrap lesson-layout"><div class="lesson-content"><article class="panel"><h2>🧠 Қарапайым түсінік</h2><p>${lesson.theory}</p></article><article class="panel"><h2>⚙️ Жұмыс принципі</h2><p>${lesson.principle}</p></article><article class="panel"><h2>🌍 Өмірден мысал</h2><p>${lesson.example}</p></article><article class="panel"><h2>💻 Бағдарлама мысалы</h2><pre class="codebox">${esc(lesson.code)}</pre><p class="notice">Бұл — оқу мысалы. Оны зертханаға көшіріп, қолдайтын команда түрін тексеруге болады.</p><button class="btn small" data-copy-lab="${lesson.id}">Зертханада байқап көру →</button></article><article class="panel"><h2>🪜 Қадамдық нұсқаулық</h2><div class="steps">${lesson.steps.map(s=>`<div class="step">${s}</div>`).join('')}</div></article><article class="panel"><h2>🎯 Төрт интерактивті жұмыс</h2>${lesson.activities.map((a,i)=>`<div class="activity"><h3>${i+1}. ${a.title}</h3><p>${a.prompt}</p><textarea aria-label="${a.title}" placeholder="Бақылауыңды немесе жауабыңды жаз…"></textarea><button class="btn small" data-activity="${i}" data-id="${lesson.id}">${progress.activities?.includes(i)?'Белгіленді ✓':'Орындадым'}</button></div>`).join('')}</article><article class="panel"><h2>🛠 Практикалық жұмыс</h2><p>${lesson.practice}</p><button class="btn small" data-go="tasks">Тапсырмаларға өту →</button></article><article class="panel"><h2>✅ Білімді тексеру · 5 сұрақ</h2>${lesson.quiz.map((q,i)=>quizHtml(q,i,lesson.id)).join('')}<button class="btn" data-submit-quiz="${lesson.id}">Жауаптарды тексеру</button><div class="feedback" data-quiz-result="${lesson.id}">Әр сұраққа жауап таңда.</div></article></div><aside class="panel side-progress"><span class="eyebrow">Сабақ барысы</span><h3 style="margin-top:10px">${progress.activities?.length||0} / 4 жұмыс</h3><div class="divider"></div><p class="muted">${lesson.courseId==='ev3'?'LEGO Mindstorms EV3':'Arduino Uno R4'} · ${lesson.number}-сабақ</p><button class="btn secondary" data-course="${lesson.courseId}">Курсқа қайту</button><div class="divider"></div><p class="notice">Прогресс осы браузерде сақталады. Жауаптарыңды тексерген соң сабақ белгіленеді.</p></aside></div></section>`;}
  function quizHtml(q,i,id){let opts=q.options||[];let controls=q.type==='multiple'?opts.map((o,j)=>`<label class="quiz-option"><input type="checkbox" data-answer="${id}-${i}" value="${j}"><span>${esc(o)}</span></label>`).join(''):q.type==='matching'?q.pairs.map(([term])=>`<label class="quiz-option"><span>${esc(term)}</span><select data-match="${id}-${i}"><option value="">Таңда…</option>${q.pairs.map(([,meaning],j)=>`<option value="${j}">${esc(meaning)}</option>`).join('')}</select></label>`).join(''):q.type==='order'?opts.map((step,j)=>`<label class="quiz-option"><span>${j+1}-орын</span><select data-order="${id}-${i}"><option value="">Қадам таңда…</option>${opts.map((item,k)=>`<option value="${k}">${esc(item)}</option>`).join('')}</select></label>`).join(''):opts.map((o,j)=>`<button class="quiz-option" data-answer="${id}-${i}" data-value="${j}">${esc(o)}</button>`).join('');return `<div class="quiz-card" data-q="${id}-${i}"><p>${i+1}. ${q.question} <span class="badge">${q.type==='single'?'Бір жауап':q.type==='multiple'?'Бірнеше жауап':q.type==='matching'?'Сәйкестендіру':q.type==='order'?'Реті':'Практика'}</span></p><div class="quiz-options">${controls}</div><div class="feedback" data-feedback="${id}-${i}" hidden></div></div>`;}
  function tasks(){const selected=current()[1]||'all';const list=selected==='all'?data.challenges:data.challenges.filter(t=>t.courseId===selected);return `${pagehead('Практика','Тапсырмалар жинағы','Әр тапсырмада мақсат, керек бөлшектер, қадамдар, күтілетін нәтиже және тексеру шарты бар.') }<section class="section"><div class="wrap"><div class="tabs"><button class="tab ${selected==='all'?'active':''}" data-taskfilter="all">Барлығы · 30</button><button class="tab ${selected==='ev3'?'active':''}" data-taskfilter="ev3">EV3 · 15</button><button class="tab ${selected==='arduino'?'active':''}" data-taskfilter="arduino">Arduino · 15</button></div><div class="lesson-list">${list.map(t=>`<details class="panel task-card"><summary><div><h3>${t.title}</h3><p>${t.goal}</p></div><span class="badge">${t.courseId==='ev3'?'EV3':'Arduino'}</span></summary><div class="divider"></div><p><b>Нұсқаулық:</b> ${t.instructions}</p><p><b>Қажетті бөлшектер:</b> ${t.components.join(' · ')}</p><div class="steps">${t.steps.map(s=>`<div class="step">${s}</div>`).join('')}</div><p><b>Күтілетін нәтиже:</b> ${t.expected}</p><p><b>Тексеру шарты:</b> ${t.check}</p><p class="notice"><b>Жиі қате:</b> ${t.commonError}</p><button class="btn small" data-open-lab="${t.courseId}">Зертханада орындау →</button></details>`).join('')}</div></div></section>`;}
  function componentList(course){return data.components[course].map(c=>`<div class="component-item" draggable="true" data-component="${c.id}"><span>${c.icon}</span><div><b>${c.name}</b><small>${c.description}</small></div></div>`).join('');}
  const pins=['D2','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12','D13','A0','A1','5V','GND'];
  function defaultPins(id){if(id==='led')return {anode:'D13',cathode:'GND'};if(id==='resistor')return {from:'D13',to:'GND',ohms:220};if(id==='hc-sr04')return {vcc:'5V',gnd:'GND',trig:'D3',echo:'D4'};if(id==='servo')return {signal:'D9',vcc:'5V',gnd:'GND'};if(id==='button')return {signal:'D2',gnd:'GND'};return {};}
  function pinEditor(item){if(lab.course==='ev3')return `<select data-pin="${item.id}:port">${['1','2','3','4','A','B','C','D'].map(x=>`<option ${item.port===x?'selected':''}>${x}</option>`).join('')}</select>`;const fields=item.id==='led'?['anode','cathode']:item.id==='resistor'?['from','to']:item.id==='hc-sr04'?['vcc','gnd','trig','echo']:item.id==='servo'?['signal','vcc','gnd']:item.id==='button'?['signal','gnd']:[];return fields.map(key=>`<select aria-label="${key}" data-pin="${item.id}:${key}"><option value="">${key.toUpperCase()}</option>${pins.map(p=>`<option value="${p}" ${item.pins?.[key]===p?'selected':''}>${p}</option>`).join('')}</select>`).join('')+(item.id==='resistor'?`<select data-ohms="${item.id}"><option value="220" ${item.pins?.ohms===220?'selected':''}>220 Ω</option><option value="330" ${item.pins?.ohms===330?'selected':''}>330 Ω</option><option value="100" ${item.pins?.ohms===100?'selected':''}>100 Ω</option></select>`:'');}
  function labPage(){const course=data.courses.find(c=>c.id===lab.course);const ids=lab.course==='ev3'?data.components.ev3:data.components.arduino;const sample=lab.course==='ev3'?'start\nrepeat 4 {\n  forward 10\n  turn right 90\n}':'speed 50\nrepeat 3 {\n  forward 10\n  turn right 90\n}\nstop';return `${pagehead('Сынақ алаңы','Виртуалды робототехника зертханасы','Бөлшекті сүйреп әкел, схеманы тексер, кодты орында. Бұл — виртуалды орта; нақты құрылғы қосылмаған.') }<section class="section"><div class="wrap"><div class="tabs"><button class="tab ${lab.course==='ev3'?'active':''}" data-labcourse="ev3">🤖 EV3 зертханасы</button><button class="tab ${lab.course==='arduino'?'active':''}" data-labcourse="arduino">⚡ Arduino зертханасы</button></div><div class="lab-toolbar"><label class="badge">Алаң <select data-arena style="width:auto;padding:4px 7px;margin-left:5px"><option value="line" ${lab.arena==='line'?'selected':''}>Сызық бойымен жүру</option><option value="maze" ${lab.arena==='maze'?'selected':''}>Лабиринттен өту</option><option value="obstacles" ${lab.arena==='obstacles'?'selected':''}>Кедергілерден айналып өту</option></select></label><span class="badge">${course.title}</span></div><div class="lab-layout"><aside class="panel"><h3>Компоненттер</h3><p class="muted" style="font-size:12px">Бөлшекті жұмыс алаңына сүйре немесе түрт.</p><div class="component-list">${componentList(lab.course)}</div></aside><section class="lab-canvas" id="dropzone"><div class="eyebrow">Жұмыс алаңы · ${lab.placed.length} бөлшек</div><div class="placed-items">${lab.placed.length?lab.placed.map(item=>{const c=ids.find(x=>x.id===item.id)||{name:item.id,icon:'🔧'};return `<div class="placed"><button class="remove" data-remove="${item.uid}" aria-label="Алып тастау">×</button><div class="emoji">${c.icon}</div><strong>${c.name}</strong>${pinEditor(item)}</div>`}).join(''):'<div class="canvas-fallback">Бөлшектерді осы жерге сүйреп әкел<br>немесе компонентті бас</div>'}</div><div class="wiring" id="wiring-result">${lab.course==='arduino'?'Жалғау қатесін энд шалгаж байна…':'Мотор мен датчик порттарын бөлшек карточкасынан таңда.'}</div></section><aside class="panel lab-right"><section><h3>💻 Бағдарлама</h3><div class="editorbar"><button class="btn small secondary" data-sample>Мысал енгізу</button><button class="btn small secondary" data-blockly-toggle>🧩 Blockly</button><span class="badge" id="blockly-state">мәтін режимі</span></div><div id="blockly-host" hidden><div id="blockly-area" style="height:185px;width:100%"></div><div class="editorbar"><button class="btn small" data-blockly-generate>Блокты кодқа айналдыру</button></div></div><textarea class="editor" id="code-editor" spellcheck="false" aria-label="Робот бағдарламасы">${sample}</textarea><p class="notice" id="editor-notice">Командалар: forward 20, backward 10, turn left 90, stop, wait 1, speed 50, repeat 3 {…}, if distance &lt; 20 {…}.</p><div class="editorbar"><button class="btn" data-run>▶ Орындау</button><button class="btn secondary" data-stop>■ Тоқтату</button><button class="btn secondary" data-reset>↺ Қайта бастау</button></div><div id="program-feedback" class="feedback">Кодың роботтың қозғалысын басқарады.</div></section><section><h3>🧭 3D симулятор</h3><div class="simstage" id="simstage"><div class="sim-grid"></div><div class="robot-dot" id="robot-dot">🤖</div><span class="obstacle-dot" style="left:70%;top:38%">📦</span></div><div class="sensorread"><div><b id="sensor-distance">100 см</b><small>Қашықтық</small></div><div><b id="sensor-angle">0°</b><small>Бағыт</small></div><div><b id="sensor-speed">50%</b><small>Жылдамдық</small></div></div></section></aside></div><p class="notice" style="margin-top:14px">Үшөлшемді көрініс қолжетімді кітапханамен ашылады; желі болмаса қозғалыс карта түрінде көрсетіледі. Командалар браузердің ішінде модельденеді.</p></div></section>`;}
  function initBlockly(){const host=$('#blockly-host'),state=$('#blockly-state');if(!host)return;if(!window.Blockly){if(state)state.textContent='Blockly желіден жүктелмеді · мәтін редакторы дайын';return;}try{const B=window.Blockly;B.defineBlocksWithJsonArray([{type:'robot_move',message0:'%1 %2 см',args0:[{type:'field_dropdown',name:'DIR',options:[['Алға','forward'],['Артқа','backward']]},{type:'field_number',name:'DIST',value:20,min:1,max:500}],previousStatement:null,nextStatement:null,colour:195},{type:'robot_turn',message0:'бұр %1 %2°',args0:[{type:'field_dropdown',name:'DIR',options:[['солға','left'],['оңға','right']]},{type:'field_number',name:'DEG',value:90,min:1,max:360}],previousStatement:null,nextStatement:null,colour:225},{type:'robot_stop',message0:'тоқта',previousStatement:null,nextStatement:null,colour:0},{type:'robot_wait',message0:'%1 секунд күт',args0:[{type:'field_number',name:'SEC',value:1,min:0,max:10}],previousStatement:null,nextStatement:null,colour:60},{type:'robot_speed',message0:'мотор жылдамдығы %1 %',args0:[{type:'field_number',name:'SPEED',value:50,min:0,max:100}],previousStatement:null,nextStatement:null,colour:120}]);
      if(lab.blockly)lab.blockly.dispose();lab.blockly=B.inject('blockly-area',{toolbox:{kind:'flyoutToolbox',contents:['robot_move','robot_turn','robot_wait','robot_speed','robot_stop'].map(type=>({kind:'block',type}))},theme:B.Theme?.Dark,grid:{spacing:20,length:3,colour:'#33445d',snap:true},zoom:{controls:true,wheel:true}});$('#blockly-state').textContent='Blockly дайын';
    }catch(e){state.textContent='Blockly ашылмады · мәтін редакторы дайын';}}
  function renderMap(result){if(!result)return;const stage=$('#simstage');if(!stage)return;const robot=$('#robot-dot');if(robot){const x=Math.max(4,Math.min(94,50+result.x*.8)),y=Math.max(10,Math.min(88,56-result.y*.7));robot.style.left=x+'%';robot.style.top=y+'%';robot.style.transform=`translate(-50%,-50%) rotate(${result.heading}deg)`;}$('#sensor-distance').textContent=`${result.distanceCm} см`;$('#sensor-angle').textContent=`${result.heading}°`;$('#sensor-speed').textContent=`${result.speed}%`;if(window.THREE)renderThree(result);}
  function renderThree(result){const stage=$('#simstage');if(!stage||!window.THREE)return;try{if(!lab.three){const T=window.THREE,scene=new T.Scene();scene.background=new T.Color(0x101a2e);const camera=new T.PerspectiveCamera(45,stage.clientWidth/205,.1,1000);camera.position.set(0,110,125);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(stage.clientWidth,205);renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.innerHTML='';stage.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x445566,2));const ground=new T.Mesh(new T.PlaneGeometry(220,150),new T.MeshStandardMaterial({color:0x16233a}));ground.rotation.x=-Math.PI/2;ground.position.y=-1;scene.add(ground);const body=new T.Mesh(new T.BoxGeometry(18,10,24),new T.MeshStandardMaterial({color:0x58d5dd,roughness:.5}));body.position.y=8;scene.add(body);for(const x of [-11,11]){const wheel=new T.Mesh(new T.CylinderGeometry(4,4,3,16),new T.MeshStandardMaterial({color:0x151b29}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,4,2);scene.add(wheel);}const obstacle=new T.Mesh(new T.BoxGeometry(18,18,18),new T.MeshStandardMaterial({color:0xe9ad70}));obstacle.position.set(36,8,0);scene.add(obstacle);lab.three={scene,camera,renderer,body};}
      const t=lab.three;t.body.position.x=(result.x-50)*.75;t.body.position.z=-result.y*.65;t.body.rotation.y=-result.heading*Math.PI/180;t.renderer.render(t.scene,t.camera);
    }catch(_){}}
  function validateLab(){if(lab.course!=='arduino'){const el=$('#wiring-result');if(el)el.innerHTML='Порттарды белгіле. Компоненттер виртуалды, нақты құрылғыға жалғанбаған.';return;}const result=sim.validateWiring(lab.placed);const el=$('#wiring-result');if(el)el.innerHTML=result.errors.length?`<div class="error-list">${result.errors.map(x=>`• ${x}`).join('<br>')}</div>`:`<div class="ok-list">${result.warnings.join('<br>')}</div>`;}
  function addComponent(id){const c=[...data.components.ev3,...data.components.arduino].find(x=>x.id===id);if(!c)return;const defaults=defaultPins(id);lab.placed.push({id,uid:`p-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,port:id==='large-motor'?'B':id==='medium-motor'?'A':id==='touch'?'1':'2',pins:defaults});render();}
  function animateTrace(result,token){const trace=result.trace;let i=0;function step(){if(token!==lab.runId||i>=trace.length){if(token===lab.runId)toast(result.error||'Бағдарлама орындалды.');return;}renderMap(trace[i++]);setTimeout(step,260);}step();}
  function runLab(){const source=$('#code-editor')?.value||'';try{const actions=sim.parseProgram(source,lab.course);lab.result=sim.simulate(actions,lab.arena);const token=++lab.runId;$('#program-feedback').textContent=`${lab.result.trace.length} команда орындалды · ${lab.result.error||'қате жоқ'}`;animateTrace(lab.result,token);}catch(e){$('#program-feedback').innerHTML=`<span style="color:var(--red)">${esc(e.message)}</span>`;}}
  function projects(){const list=core.listProjects();return `${pagehead('Жұмыстарың','Менің жобаларым','Жоба атауы мен бағдарламаң осы браузерде сақталады.')}<section class="section"><div class="wrap grid two"><article class="panel"><h2>➕ Жаңа жобаны сақтау</h2><label>Жоба атауы<input class="field" id="project-name" value="Менің роботым"></label><label style="display:block;margin-top:10px">Курс<select id="project-course"><option value="ev3">LEGO Mindstorms EV3</option><option value="arduino">Arduino Uno R4</option></select></label><label style="display:block;margin-top:10px">Бағдарлама<textarea class="editor" id="project-code">forward 20\nturn right 90\nstop</textarea></label><button class="btn" data-save-project style="margin-top:10px">Жобаны сақтау</button></article><article class="panel"><span class="eyebrow">Жеке қор</span><h2 style="margin-top:8px">Сақталған жобалар · ${list.length}</h2>${list.length?list.map(p=>`<div class="project-row"><div><b>${esc(p.name)}</b><small>${p.courseId==='ev3'?'EV3':'Arduino'} · ${new Date(p.updatedAt).toLocaleDateString('kk-KZ')}</small><code class="codebox" style="display:block;margin-top:6px;padding:8px">${esc(p.code)}</code></div><button class="btn secondary small" data-delete-project="${p.id}">Өшіру</button></div>`).join(''):'<div class="empty">Әзірге жоба жоқ. Алғашқы программаңды сақта.</div>'}<p class="notice">Жеке деректер бұл браузерден шықпайды. Көп құрылғыда синхрондау Supabase баптауын қажет етеді.</p></article></div></section>`;}
  function cabinet(){const state=core.getState();return `${pagehead('Оқу кабинеті','Оқушы және мұғалім кабинеті','Бұл демо кабинет бір браузерде жұмыс істейді. Шынайы ортақ аккаунт пен синхрондау үшін Supabase қосылымы қажет.')}<section class="section"><div class="wrap"><div class="tabs"><button class="tab ${state.role==='student'?'active':''}" data-role="student">👩‍🎓 Оқушы</button><button class="tab ${state.role==='teacher'?'active':''}" data-role="teacher">👩‍🏫 Мұғалім</button></div>${state.role==='student'?studentCabinet(state):teacherCabinet(state)}</div></section>`;}
  function studentCabinet(state){const complete=Object.entries(state.progress).filter(([,x])=>x.completed);const average=complete.length?Math.round(complete.reduce((s,[,x])=>s+x.score,0)/complete.length):0;return `<div class="stats"><div class="stat"><strong>${complete.length}/30</strong><span>аяқталған сабақ</span></div><div class="stat"><strong>${average}%</strong><span>орташа тест нәтижесі</span></div><div class="stat"><strong>${state.projects.length}</strong><span>сақталған жоба</span></div><div class="stat"><strong>${Object.values(state.progress).reduce((s,x)=>s+(x.activities?.length||0),0)}</strong><span>орындалған белсенділік</span></div></div><div class="grid two" style="margin-top:15px"><article class="panel"><h2>Оқу барысы</h2>${data.courses.map(c=>{const n=complete.filter(([id])=>id.startsWith(c.id+'-')).length;return `<p>${c.title} · ${n}/15</p><progress value="${n}" max="15" style="width:100%;accent-color:var(--cyan)"></progress>`}).join('')}</article><article class="panel"><h2>Жетістік</h2><p>${complete.length>=15?'🏆 Жарты жолды бағындырдың!':complete.length>=5?'✨ Зерттеуші деңгейіне жеттің!':complete.length?'🌱 Алғашқы қадамың жасалды!':'🤖 Бірінші сабағыңды аш та, бастайық.'}</p><button class="btn" data-go="courses">Сабақтарды жалғастыру</button></article></div>`;}
  function teacherCabinet(state){return `<div class="teacher-grid"><article class="panel"><h2>🏫 Сынып</h2><p>Demo сынып · ең көбі 25 оқушы</p><div class="formrow"><input class="field" id="student-name" placeholder="Оқушының аты"><button class="btn small" data-add-student>Оқушы қосу</button></div><div class="feedback" id="teacher-feedback">${state.students.length}/25 оқушы</div></article><article class="panel"><h2>📌 Тапсырма беру</h2><select id="assign-select" class="field">${data.challenges.slice(0,15).map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><button class="btn small" data-assign style="margin-top:8px">Таңдалған тапсырманы беру</button><div class="feedback">Берілген тапсырма: ${state.assignments.length}</div></article></div><article class="panel" style="margin-top:14px"><h2>Оқушылардың прогресі · ${state.students.length}</h2>${state.students.length?`<div class="tablewrap"><table><thead><tr><th>Оқушы</th><th>Баға (1–5)</th><th>Пікір</th><th>Әрекет</th></tr></thead><tbody>${state.students.map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" min="1" max="5" value="${s.grade||''}" data-grade="${s.id}" style="width:70px"></td><td><input class="field" data-comment="${s.id}" value="${esc(s.feedback)}" placeholder="Қысқа пікір"></td><td><button class="btn small" data-save-grade="${s.id}">Сақтау</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Сыныпқа оқушы қоссаң, баға мен пікір осы жерде көрінеді.</p>'}</article><p class="notice">Мұғалім функциялары осы браузерде локал demo ретінде сақталады; бұл аккаунт серверге синхрондалмаған.</p>`;}
  function blockGenerate(){if(!lab.blockly)return;let out='';for(let b=lab.blockly.getTopBlocks(true);b;b=b.getNextBlock()){const f=b.getFieldValue;switch(b.type){case'robot_move':out+=`${f('DIR')} ${f('DIST')}\n`;break;case'robot_turn':out+=`turn ${f('DIR')} ${f('DEG')}\n`;break;case'robot_stop':out+='stop\n';break;case'robot_wait':out+=`wait ${f('SEC')}\n`;break;case'robot_speed':out+=`speed ${f('SPEED')}\n`;break;}}if(out)$('#code-editor').value=out;}
  function render(){const [page,id]=current();if(page==='home'||!page){shell(home());}else if(page==='courses')shell(courses());else if(page==='course')shell(coursePage(id));else if(page==='lesson')shell(lessonPage(id));else if(page==='tasks')shell(tasks());else if(page==='lab')shell(labPage());else if(page==='projects')shell(projects());else if(page==='cabinet')shell(cabinet());else shell(home());
    $$('[data-back]').forEach(b=>b.onclick=()=>go('courses'));
    $$('[data-course]').forEach(b=>b.onclick=()=>go(`course/${b.dataset.course}`));
    $$('[data-lesson]').forEach(b=>b.onclick=()=>go(`lesson/${b.dataset.lesson}`));
    $$('[data-copy-lab]').forEach(b=>b.onclick=()=>{const l=data.lessons.find(x=>x.id===b.dataset.copyLab);lab.course=l.courseId;go('lab');setTimeout(()=>{$('#code-editor').value=l.code},30)});
    $$('[data-activity]').forEach(b=>b.onclick=()=>{const box=b.closest('.activity'),text=$('textarea',box).value.trim();if(!text){toast('Алдымен байқағаныңды жаз.');return;}core.markActivity(b.dataset.id,Number(b.dataset.activity));b.textContent='Белгіленді ✓';toast('Белсенділік сақталды.');});
    $$('[data-answer]').filter(x=>x.tagName==='BUTTON').forEach(b=>b.onclick=()=>{const parent=b.closest('.quiz-options');$$('.quiz-option',parent).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');});
    $$('[data-submit-quiz]').forEach(b=>b.onclick=()=>{const l=data.lessons.find(x=>x.id===b.dataset.submitQuiz);let score=0,answered=0;l.quiz.forEach((q,i)=>{const key=`${l.id}-${i}`,box=$(`[data-q="${key}"]`),checks=$$(`input[data-answer="${key}"]:checked`,box),chosen=checks.length?checks.map(x=>Number(x.value)):$('.quiz-option.selected',box)?.dataset.value;let answer=Array.isArray(chosen)?chosen:chosen===undefined?null:Number(chosen);if(q.type==='matching')answer=$$(`select[data-match="${key}"]`,box).map(x=>x.value===''?null:Number(x.value));if(q.type==='order')answer=$$(`select[data-order="${key}"]`,box).map(x=>x.value===''?null:Number(x.value));const f=$(`[data-feedback="${key}"]`);if(answer===null||(Array.isArray(answer)&&answer.some(x=>x===null)))return;answered++;const result=core.gradeAnswer(q,answer);if(result.correct)score++;f.hidden=false;f.textContent=`${result.correct?'Дұрыс!':'Қайта қарап көр.'} ${result.feedback}`;});const out=$(`[data-quiz-result="${l.id}"]`);if(answered<5){out.textContent=`${answered}/5 сұраққа жауап бердің. Қалғанын таңда.`;return;}const pct=Math.round(score/5*100);core.completeLesson(l.id,pct);out.textContent=`Нәтиже: ${score}/5 · ${pct}%. ${pct>=60?'Сабақ аяқталды — жарайсың!':'Теорияны қайталап, қайта тапсырып көр.'}`;});
    $$('[data-taskfilter]').forEach(b=>b.onclick=()=>go(`tasks/${b.dataset.taskfilter}`));
    $$('[data-open-lab]').forEach(b=>b.onclick=()=>{lab.course=b.dataset.openLab;go('lab')});
    $$('[data-labcourse]').forEach(b=>b.onclick=()=>{lab.course=b.dataset.labcourse;lab.placed=[];lab.result=null;render()});
    $$('[data-component]').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.component);el.onclick=()=>addComponent(el.dataset.component)});
    const drop=$('#dropzone');if(drop){drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addComponent(e.dataTransfer.getData('text/plain'));};}
    $$('[data-remove]').forEach(b=>b.onclick=()=>{lab.placed=lab.placed.filter(x=>x.uid!==b.dataset.remove);render()});
    $$('[data-pin]').forEach(s=>s.onchange=()=>{const [uid,key]=s.dataset.pin.split(':');const item=lab.placed.find(x=>x.uid===uid);if(key==='port')item.port=s.value;else item.pins[key]=s.value;validateLab()});
    $$('[data-ohms]').forEach(s=>s.onchange=()=>{lab.placed.find(x=>x.uid===s.dataset.ohms).pins.ohms=Number(s.value);validateLab()});
    $('[data-arena]')?.addEventListener('change',e=>{lab.arena=e.target.value;lab.result=null;renderMap({x:0,y:0,heading:0,distanceCm:100,speed:50});});
    $('[data-sample]')?.addEventListener('click',()=>{$('#code-editor').value=lab.course==='ev3'?'start\nrepeat 4 {\n  forward 10\n  turn right 90\n}':'speed 50\nrepeat 3 {\n  forward 10\n  turn right 90\n}\nstop';});
    $('[data-blockly-toggle]')?.addEventListener('click',()=>{const host=$('#blockly-host');host.hidden=!host.hidden;if(!host.hidden)initBlockly();});
    $('[data-blockly-generate]')?.addEventListener('click',blockGenerate);
    $('[data-run]')?.addEventListener('click',()=>{if(lab.course==='arduino'){validateLab();const v=sim.validateWiring(lab.placed);if(lab.placed.some(x=>['led','hc-sr04','servo'].includes(x.id))&&v.errors.length){$('#program-feedback').textContent='Алдымен жалғау қатесін түзет. Симулятор іске қосылмады.';return;}}runLab();});
    $('[data-stop]')?.addEventListener('click',()=>{lab.runId++;$('#program-feedback').textContent='Орындау тоқтатылды.';});
    $('[data-reset]')?.addEventListener('click',()=>{lab.runId++;lab.result=null;renderMap({x:0,y:0,heading:0,distanceCm:100,speed:50});$('#program-feedback').textContent='Робот бастапқы орынға қайтты.';});
    if(page==='lab'){validateLab();renderMap({x:0,y:0,heading:0,distanceCm:100,speed:50});}
    $$('[data-save-project]').forEach(b=>b.onclick=()=>{const project=core.saveProject({name:$('#project-name').value,courseId:$('#project-course').value,code:$('#project-code').value});if(!core.storageAvailable())toast('Браузер жобаны тұрақты сақтауға рұқсат бермеді.');else toast(`«${project.name}» жобасы сақталды.`);render();});
    $$('[data-delete-project]').forEach(b=>b.onclick=()=>{core.deleteProject(b.dataset.deleteProject);render()});
    $$('[data-role]').forEach(b=>b.onclick=()=>{core.setRole(b.dataset.role);render()});
    $('[data-add-student]')?.addEventListener('click',()=>{const result=core.addStudent($('#student-name').value);if(!result.ok){$('#teacher-feedback').textContent=result.error;return;}render();});
    $('[data-assign]')?.addEventListener('click',()=>{const task=data.challenges.find(t=>t.id===$('#assign-select').value);core.assignTask({title:task.title,lessonId:task.courseId+'-'+Math.ceil(Number(task.id.split('-').at(-1)))});render();});
    $$('[data-save-grade]').forEach(b=>b.onclick=()=>{core.gradeStudent(b.dataset.saveGrade,$(`[data-grade="${b.dataset.saveGrade}"]`).value,$(`[data-comment="${b.dataset.saveGrade}"]`).value);toast('Баға мен пікір сақталды.');});
  }
  window.addEventListener('hashchange',render);window.addEventListener('storage',()=>{});render();if(supabaseClient)supabaseClient.auth.onAuthStateChange((_event,session)=>{account=session?.user||null;if(account){supabaseClient.from('user_data').select('state').eq('user_id',account.id).maybeSingle().then(({data:remote})=>{if(remote?.state){core.replaceState(remote.state);render();}else syncAccount();});}else render();});
})();

</script>
</body></html>
